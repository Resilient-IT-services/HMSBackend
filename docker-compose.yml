services:
    backend:
        build: .
        container_name: hms-backend
        env_file:
            - .env
        ports:
            - "8070:8070"
        restart: always
        depends_on:
            - postgres


    frontend:
        build:
            context: ../HMSFrontEnd
            dockerfile: Dockerfile
        container_name: hms-frontend
        ports:
            - "3000:3000"

    nginx:
        build:
            context: .
            dockerfile: Dockerfile.nginx
        container_name: hms-nginx
        ports:
            - "80:80"
            - "443:443"
        depends_on:
            - frontend
            - backend
        networks:
            - default
            - shared-network
    postgres:
        image: postgres:15
        container_name: hms-postgres
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "6543:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data

    cloudflared:
        image: cloudflare/cloudflared:latest
        container_name: hms-cloudflared
        restart: unless-stopped
        command: tunnel --loglevel debug run
        environment:
            TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
        depends_on:
            - nginx

volumes:
    pgdata:
networks:
    shared-network:
        name: shared-network

