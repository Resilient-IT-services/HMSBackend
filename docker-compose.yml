services:
    backend:
        build: .
        container_name: hms-backend
        env_file:
            - .env
        ports:
            - "8070:8070"
        restart: always
        depends_on:
            - postgres
    frontend:
        build:
            context: ../HMSFrontEnd   # ✅ correct path
            dockerfile: Dockerfile
        container_name: hms-frontend
        ports:
            - "3000:3000"
    nginx:
        image: nginx:latest
        container_name: hms-nginx
        ports:
            - "80:80"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf
        depends_on:
            - frontend
            - backend
    postgres:
        image: postgres:15
        container_name: hms-postgres
        environment:
            POSTGRES_DB: hms
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: dR3H8dKS89xB6RHq
        ports:
            - "6543:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
    cloudflared:
        image: cloudflare/cloudflared:latest
        container_name: hms-cloudflared
        restart: unless-stopped
        command: tunnel run
        environment:
            - TUNNEL_TOKEN=eyJhIjoiMGEwNjQ2YWZlODkxNDVkMTk0MTEzMGNhMTFhMmEyYzYiLCJ0IjoiNjM2OGE1MDMtZDUyNy00OGM2LTg3M2MtZDM1NDAxNDMzY2Q1IiwicyI6Ik1qWXhOR1l5TnpBdE5XUXhPQzAwTlRRM0xXRmxPREV0TnpGa1l6TTVaVE5pTVdZMiJ9   # 👈 paste your token here
        depends_on:
            - nginx
volumes:
    pgdata:
