events {}

http {
  server {
    listen 80;

    # Common headers (apply to all proxied requests)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # =========================
    # FRONTEND
    # =========================
    location / {
      proxy_pass http://frontend:3000;
    }

    # =========================
    # BACKEND API
    # =========================
    location /api/ {
      proxy_pass http://backend:8070/api/;
    }

    # =========================
    # SWAGGER
    # =========================
    location /swagger-ui/ {
      proxy_pass http://backend:8070/swagger-ui/;
    }

    location /v3/api-docs/ {
      proxy_pass http://backend:8070/v3/api-docs/;
    }

    # =========================
    # AUTH (optional clarity)
    # =========================
    location /auth/ {
      proxy_pass http://backend:8070/auth/;
    }
  }
}
