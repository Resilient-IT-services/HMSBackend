spring:
  application:
    name: hms-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hms}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:2004}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  bootstrap:
    admin-username: ${HMS_ADMIN_USERNAME:admin}
    admin-password: ${HMS_ADMIN_PASSWORD:admin123}
