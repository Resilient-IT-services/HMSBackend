spring:
  application:
    name: hms-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hms}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:2004}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
  flyway:
    enabled: true
    validate-on-migrate: false
    locations: classpath:db/migration/common,classpath:db/migration/postgres
    placeholders:
      uuid_gen: (md5(random()::text || clock_timestamp()::text))::uuid
  jackson:
    default-property-inclusion: non_null

logging:
  level:
    org.hibernate.SQL: ${LOG_SQL_LEVEL:ERROR}
    org.hibernate.orm.jdbc.bind: ${LOG_BIND_LEVEL:ERROR}

server:
  port: ${SERVER_PORT:8081}
  error:
    include-stacktrace: ${SERVER_ERROR_STACKTRACE:never}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  bootstrap:
    admin-username: ${HMS_ADMIN_USERNAME:admin}
    admin-password: ${HMS_ADMIN_PASSWORD:admin123}
