spring:
  datasource:
    url: jdbc:h2:mem:hms;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/h2
    placeholders:
      uuid_gen: RANDOM_UUID()

app:
  bootstrap:
    admin-username: admin
    admin-password: admin123
    hospital-code: TEST
    hospital-name: Test Hospital
