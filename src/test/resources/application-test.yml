spring:
  datasource:
    url: jdbc:h2:mem:hms;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;INIT=CREATE SCHEMA IF NOT EXISTS public\;CREATE SCHEMA IF NOT EXISTS core\;CREATE SCHEMA IF NOT EXISTS iam\;CREATE SCHEMA IF NOT EXISTS staff\;CREATE SCHEMA IF NOT EXISTS patient\;CREATE SCHEMA IF NOT EXISTS appointment\;CREATE SCHEMA IF NOT EXISTS clinical\;CREATE SCHEMA IF NOT EXISTS billing\;CREATE SCHEMA IF NOT EXISTS pharmacy\;CREATE SCHEMA IF NOT EXISTS inventory\;CREATE SCHEMA IF NOT EXISTS platform\;CREATE SCHEMA IF NOT EXISTS tax\;CREATE SCHEMA IF NOT EXISTS lab
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: public
        hbm2ddl:
          create_namespaces: true
  flyway:
    enabled: false

app:
  bootstrap:
    admin-username: admin
    admin-password: admin123
    hospital-code: TEST
    hospital-name: Test Hospital
